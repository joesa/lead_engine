name: Test

on:
  push:
  pull_request:

jobs:
  closet-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: closet-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: closet-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - name: customSite shared-core sync
        run: npm run test:custom-site-sync

  closet-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: closet-scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: closet-scraper/package-lock.json
      - run: npm ci
      - run: npm test

  closet-widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: closet-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: closet-widget/package-lock.json
      - run: npm ci
      - run: npm test

  custom-closets-websites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-closets-websites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: custom-closets-websites/package-lock.json
      - run: npm ci
      - run: npm test
      - name: customSite shared-core sync
        run: npm run test:custom-site-sync
